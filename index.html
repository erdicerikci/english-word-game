<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Scramble Pro & Leaderboard</title>
    <style>
        :root {
            --primary: #0f766e; /* Deniz Yeşili / Teal */
            --primary-hover: #115e59;
            --bg-color: #f0fdfa;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-light: #64748b;
            --success: #16a34a;
            --error: #dc2626;
            --timer-color: #ea580c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .game-container, .leaderboard-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 20px;
        }

        .leaderboard-container {
            display: none; /* Oyun bitene kadar gizli */
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: #e2e8f0;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .timer {
            color: var(--timer-color);
            font-size: 1.1rem;
        }

        .scrambled-word {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 5px;
            background: #ccfbf1;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hint-text {
            font-style: italic;
            color: var(--text-light);
            margin-bottom: 15px;
            min-height: 24px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }

        .action-buttons {
            display: flex;
            gap: 10px;
        }
        
        .action-buttons button {
            flex: 1;
            background-color: #64748b;
        }
        
        .action-buttons button:hover { background-color: #475569; }

        .message { margin-top: 15px; font-weight: bold; min-height: 24px; }
        .success { color: var(--success); }
        .error { color: var(--error); }

        /* Liderlik Tablosu Stilleri */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background-color: #f8fafc; color: var(--text-light); }
        .rank { font-weight: bold; color: var(--primary); }
        
    </style>
</head>
<body>

    <!-- Oyun Ekranı -->
    <div class="game-container" id="game-screen">
        <h1>Word Scramble</h1>
        <p style="color:#64748b; margin-bottom: 20px;">Unscramble the letters before time runs out!</p>

        <div class="stats-bar">
            <span>Score: <span id="score">0</span></span>
            <span class="timer">⏱ <span id="time">30</span>s</span>
            <span>Word: <span id="current-word-num">1</span>/10</span>
        </div>

        <div class="scrambled-word" id="scrambled">------</div>
        <div class="hint-text" id="hint">Hint: Loading...</div>

        <div class="input-group">
            <input type="text" id="user-input" placeholder="Type your answer..." autocomplete="off">
            <button id="submit-btn">Check</button>
        </div>

        <div class="action-buttons">
            <button id="hint-btn">Get Hint</button>
            <button id="skip-btn">Skip</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <!-- Liderlik Tablosu Ekranı -->
    <div class="leaderboard-container" id="leaderboard-screen">
        <h1>Leaderboard</h1>
        <p style="color:#64748b;">Top 5 Scores</p>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- Skorlar buraya eklenecek -->
            </tbody>
        </table>
        <button onclick="location.reload()" style="margin-top: 20px; width: 100%;">Play Again</button>
    </div>

    <script>
        // Yeni Kelime Havuzu
        const words = [
            { word: "vessel", hint: "A large ship or boat" },
            { word: "anchor", hint: "Heavy object dropped to keep a ship in place" },
            { word: "compass", hint: "Instrument used for navigation" },
            { word: "harbor", hint: "A place on the coast where vessels may find shelter" },
            { word: "captain", hint: "The person in command of a ship" },
            { word: "voyage", hint: "A long journey involving travel by sea" },
            { word: "sailor", hint: "A person whose job it is to work as a member of the crew" },
            { word: "lighthouse", hint: "A tower with a light that gives warning to ships" },
            { word: "ocean", hint: "A very large expanse of sea" },
            { word: "navigate", hint: "Direct the course of a ship" }
        ];

        let currentWordIndex = 0;
        let score = 0;
        let currentWordObj = {};
        let timeLeft = 30;
        let timerInterval;

        const scrambledEl = document.getElementById("scrambled");
        const hintEl = document.getElementById("hint");
        const userInputEl = document.getElementById("user-input");
        const submitBtn = document.getElementById("submit-btn");
        const hintBtn = document.getElementById("hint-btn");
        const skipBtn = document.getElementById("skip-btn");
        const messageEl = document.getElementById("message");
        const scoreEl = document.getElementById("score");
        const timeEl = document.getElementById("time");
        const currentWordNumEl = document.getElementById("current-word-num");
        
        const gameScreen = document.getElementById("game-screen");
        const leaderboardScreen = document.getElementById("leaderboard-screen");
        const leaderboardBody = document.getElementById("leaderboard-body");

        function shuffleWord(word) {
            let arr = word.split("");
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            let scrambled = arr.join("");
            if (scrambled === word) return shuffleWord(word);
            return scrambled;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30; // Her kelime için 30 saniye
            timeEl.textContent = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    messageEl.textContent = `Time's up! The word was: ${currentWordObj.word}`;
                    messageEl.className = "message error";
                    currentWordIndex++;
                    setTimeout(loadNewWord, 2000);
                }
            }, 1000);
        }

        function loadNewWord() {
            if (currentWordIndex >= words.length) {
                endGame();
                return;
            }

            currentWordObj = words[currentWordIndex];
            scrambledEl.textContent = shuffleWord(currentWordObj.word);
            hintEl.textContent = "Hint: Click 'Get Hint' if you need help.";
            userInputEl.value = "";
            messageEl.textContent = "";
            scoreEl.textContent = score;
            currentWordNumEl.textContent = currentWordIndex + 1;
            userInputEl.focus();
            
            startTimer();
        }

        function checkAnswer() {
            const userGuess = userInputEl.value.trim().toLowerCase();
            if (!userGuess) return;

            if (userGuess === currentWordObj.word) {
                clearInterval(timerInterval);
                
                // Hızlı bilenlere bonus puan (15 saniyeden fazla kaldıysa +5 puan)
                let timeBonus = timeLeft > 15 ? 5 : 0;
                score += (10 + timeBonus);
                
                messageEl.textContent = timeBonus > 0 ? `Correct! +${10 + timeBonus} (Time Bonus!)` : "Correct! Great job!";
                messageEl.className = "message success";
                currentWordIndex++;
                setTimeout(loadNewWord, 1500);
            } else {
                messageEl.textContent = "Incorrect! Try again.";
                messageEl.className = "message error";
                userInputEl.focus();
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            gameScreen.style.display = "none";
            leaderboardScreen.style.display = "block";
            
            // Kullanıcıdan isim al
            let playerName = prompt("Game Over! Enter your name for the leaderboard:", "Player");
            if (!playerName || playerName.trim() === "") playerName = "Anonymous";
            
            saveScore(playerName, score);
            displayLeaderboard();
        }

        // Skorları tarayıcı hafızasına kaydet (LocalStorage)
        function saveScore(name, finalScore) {
            let scores = JSON.parse(localStorage.getItem("wordScrambleScores")) || [];
            scores.push({ name: name, score: finalScore });
            
            // Skorlara göre büyükten küçüğe sırala
            scores.sort((a, b) => b.score - a.score);
            
            // Sadece ilk 5 skoru tut
            scores = scores.slice(0, 5);
            localStorage.setItem("wordScrambleScores", JSON.stringify(scores));
        }

        // Liderlik tablosunu ekrana yazdır
        function displayLeaderboard() {
            let scores = JSON.parse(localStorage.getItem("wordScrambleScores")) || [];
            leaderboardBody.innerHTML = "";
            
            scores.forEach((entry, index) => {
                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="rank">#${index + 1}</td>
                    <td>${entry.name}</td>
                    <td><strong>${entry.score}</strong></td>
                `;
                leaderboardBody.appendChild(tr);
            });
        }

        submitBtn.addEventListener("click", checkAnswer);
        userInputEl.addEventListener("keypress", (e) => {
            if (e.key === "Enter") checkAnswer();
        });

        hintBtn.addEventListener("click", () => {
            hintEl.textContent = `Hint: ${currentWordObj.hint}`;
            // İpucu kullanıldığında 2 puan düş (skor 0'dan aşağı inmesin)
            score = Math.max(0, score - 2);
            scoreEl.textContent = score;
        });

        skipBtn.addEventListener("click", () => {
            clearInterval(timerInterval);
            messageEl.textContent = `Skipped! The word was: ${currentWordObj.word}`;
            messageEl.className = "message error";
            currentWordIndex++;
            setTimeout(loadNewWord, 1500);
        });

        // Oyunu başlat
        loadNewWord();
    </script>
</body>
</html>
