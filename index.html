<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Scramble Pro - 1000+ Words</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --bg-color: #f0fdfa;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-light: #64748b;
            --success: #16a34a;
            --error: #dc2626;
            --timer-color: #ea580c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .game-container, .leaderboard-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 20px;
        }

        .leaderboard-container { display: none; }

        h1 { margin-top: 0; color: var(--primary); font-size: 1.8rem; margin-bottom: 5px; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: #e2e8f0;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .timer { color: var(--timer-color); font-size: 1.1rem; }

        .scrambled-word {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 5px;
            background: #ccfbf1;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hint-text {
            font-style: italic;
            color: var(--text-light);
            margin-bottom: 15px;
            min-height: 48px;
        }

        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--primary); }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }

        .action-buttons { display: flex; gap: 10px; }
        .action-buttons button { flex: 1; background-color: #64748b; }
        .action-buttons button:hover { background-color: #475569; }

        .message { margin-top: 15px; font-weight: bold; min-height: 24px; }
        .success { color: var(--success); }
        .error { color: var(--error); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background-color: #f8fafc; color: var(--text-light); }
        .rank { font-weight: bold; color: var(--primary); }
        
        #loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9); display: flex;
            justify-content: center; align-items: center;
            border-radius: 16px; font-weight: bold; color: var(--primary);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="game-container" id="game-screen">
        <div id="loading-overlay">Loading 1000+ words database...</div>
        
        <h1>Word Scramble</h1>
        <p style="color:#64748b; margin-bottom: 20px;">Unscramble the letters before time runs out!</p>

        <div class="stats-bar">
            <span>Score: <span id="score">0</span></span>
            <span class="timer">⏱ <span id="time">30</span>s</span>
            <span>Word: <span id="current-word-num">1</span>/10</span>
        </div>

        <div class="scrambled-word" id="scrambled">------</div>
        <div class="hint-text" id="hint">Hint will appear here...</div>

        <div class="input-group">
            <input type="text" id="user-input" placeholder="Type your answer..." autocomplete="off">
            <button id="submit-btn">Check</button>
        </div>

        <div class="action-buttons">
            <button id="hint-btn">Get Hint (-2 pts)</button>
            <button id="skip-btn">Skip</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <div class="leaderboard-container" id="leaderboard-screen">
        <h1>Leaderboard</h1>
        <p style="color:#64748b;">Top 5 Scores</p>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
        <button onclick="location.reload()" style="margin-top: 20px; width: 100%;">Play Again</button>
    </div>

    <script>
        let allWords = [];
        let currentWordIndex = 0;
        let score = 0;
        let currentWord = "";
        let currentHint = "";
        let timeLeft = 30;
        let timerInterval;

        const scrambledEl = document.getElementById("scrambled");
        const hintEl = document.getElementById("hint");
        const userInputEl = document.getElementById("user-input");
        const submitBtn = document.getElementById("submit-btn");
        const hintBtn = document.getElementById("hint-btn");
        const skipBtn = document.getElementById("skip-btn");
        const messageEl = document.getElementById("message");
        const scoreEl = document.getElementById("score");
        const timeEl = document.getElementById("time");
        const currentWordNumEl = document.getElementById("current-word-num");
        const overlay = document.getElementById("loading-overlay");

        // Başlangıçta binlerce kelimelik listeyi internetten çekiyoruz
        async function initGame() {
            try {
                // En çok kullanılan İngilizce kelimeler listesi
                const res = await fetch('https://raw.githubusercontent.com/first20hours/google-10000-english/master/google-10000-english-no-swears.txt');
                const text = await res.text();
                // Sadece 4 ile 8 harf arası olan 1500 kelimeyi filtrele
                allWords = text.split('\n').filter(w => w.length >= 4 && w.length <= 8).slice(0, 1500);
            } catch (e) {
                // İnternet sorunu olursa yedek liste
                allWords = ["language", "beautiful", "knowledge", "environment", "technology", "adventure", "important", "university"];
            }
            overlay.style.display = "none";
            loadNewWord();
        }

        function shuffleWord(word) {
            let arr = word.split("");
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            let scrambled = arr.join("");
            if (scrambled === word) return shuffleWord(word);
            return scrambled;
        }

        // Kelimenin anlamını sözlük API'sinden anlık çeker
        async function fetchDictionaryHint(word) {
            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                const data = await res.json();
                if(data && data[0] && data[0].meanings[0].definitions[0].definition) {
                    return data[0].meanings[0].definitions[0].definition;
                }
            } catch(e) {}
            return `A general English word starting with the letter '${word[0].toUpperCase()}'`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            timeEl.textContent = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    messageEl.textContent = `Time's up! The word was: ${currentWord}`;
                    messageEl.className = "message error";
                    currentWordIndex++;
                    setTimeout(loadNewWord, 2000);
                }
            }, 1000);
        }

        async function loadNewWord() {
            if (currentWordIndex >= 10) { // Her oyun 10 kelime sürer
                endGame();
                return;
            }

            // Havuzdan rastgele kelime seç
            currentWord = allWords[Math.floor(Math.random() * allWords.length)];
            scrambledEl.textContent = shuffleWord(currentWord);
            
            hintEl.textContent = "Hint: Click 'Get Hint' button to load meaning.";
            currentHint = ""; // Henüz çekilmedi
            
            userInputEl.value = "";
            messageEl.textContent = "";
            scoreEl.textContent = score;
            currentWordNumEl.textContent = currentWordIndex + 1;
            userInputEl.focus();
            
            startTimer();
            
            // Arka planda ipucunu hazırlıyoruz
            currentHint = await fetchDictionaryHint(currentWord);
        }

        function checkAnswer() {
            const userGuess = userInputEl.value.trim().toLowerCase();
            if (!userGuess) return;

            if (userGuess === currentWord) {
                clearInterval(timerInterval);
                let timeBonus = timeLeft > 15 ? 5 : 0;
                score += (10 + timeBonus);
                
                messageEl.textContent = timeBonus > 0 ? `Correct! +${10 + timeBonus} (Time Bonus!)` : "Correct! Great job!";
                messageEl.className = "message success";
                currentWordIndex++;
                setTimeout(loadNewWord, 1500);
            } else {
                messageEl.textContent = "Incorrect! Try again.";
                messageEl.className = "message error";
                userInputEl.focus();
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById("game-screen").style.display = "none";
            document.getElementById("leaderboard-screen").style.display = "block";
            
            let playerName = prompt("Game Over! Enter your name for the leaderboard:", "Player");
            if (!playerName || playerName.trim() === "") playerName = "Anonymous";
            
            saveScore(playerName, score);
            displayLeaderboard();
        }

        function saveScore(name, finalScore) {
            let scores = JSON.parse(localStorage.getItem("wordScrambleScores")) || [];
            scores.push({ name: name, score: finalScore });
            scores.sort((a, b) => b.score - a.score);
            scores = scores.slice(0, 5);
            localStorage.setItem("wordScrambleScores", JSON.stringify(scores));
        }

        function displayLeaderboard() {
            let scores = JSON.parse(localStorage.getItem("wordScrambleScores")) || [];
            const tbody = document.getElementById("leaderboard-body");
            tbody.innerHTML = "";
            scores.forEach((entry, index) => {
                let tr = document.createElement("tr");
                tr.innerHTML = `<td class="rank">#${index + 1}</td><td>${entry.name}</td><td><strong>${entry.score}</strong></td>`;
                tbody.appendChild(tr);
            });
        }

        submitBtn.addEventListener("click", checkAnswer);
        userInputEl.addEventListener("keypress", (e) => { if (e.key === "Enter") checkAnswer(); });

        hintBtn.addEventListener("click", () => {
            if (currentHint === "") {
                hintEl.textContent = "Fetching hint from dictionary... Please wait.";
            } else {
                hintEl.textContent = `Hint: ${currentHint}`;
                score = Math.max(0, score - 2);
                scoreEl.textContent = score;
            }
        });

        skipBtn.addEventListener("click", () => {
            clearInterval(timerInterval);
            messageEl.textContent = `Skipped! The word was: ${currentWord}`;
            messageEl.className = "message error";
            currentWordIndex++;
            setTimeout(loadNewWord, 1500);
        });

        // Oyunu veri tabanını çekerek başlat
        initGame();
    </script>
</body>
</html>
